name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: arduino/setup-task@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: task test

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: '0'
        run: |
          mkdir dist
          for os in darwin windows; do
            for arch in arm64 amd64; do
              name="iphone-backup_${GITHUB_REF_NAME}_${os}_${arch}"
              exe=iphone-backup
              [ "$os" = windows ] && exe=iphone-backup.exe
              mkdir "$name"
              GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "$name/$exe" ./cmd/iphone-backup
              cp LICENSE LICENSE-3RD-PARTY.md "$name/"
              if [ "$os" = windows ]; then
                zip -qr "dist/$name.zip" "$name"
              else
                tar -czf "dist/$name.tar.gz" "$name"
              fi
            done
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
